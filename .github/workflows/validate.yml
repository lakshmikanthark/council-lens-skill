# SPDX-License-Identifier: Apache-2.0
name: Validate Council Lens

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Skill
        run: python scripts/validate_skill.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Build and prove reproducibility
        run: python scripts/build_skill.py --check-reproducible

      - name: Validate repository
        run: python scripts/validate_repo.py

      - name: Adversarial release QA
        run: python scripts/release_qa.py

      - name: Upload installable Skill
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: council-lens-skill
          path: dist/skill.zip
          if-no-files-found: error
