# SPDX-License-Identifier: Apache-2.0
name: Bug report
description: Report a reproducible problem with the Skill or release tooling
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Do not include private conversations, credentials, proprietary files, or sensitive personal data.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Share a sanitized prompt or repository command that demonstrates the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
